<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell Tax Free — Upload</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap">
    <h1>Sell Tax Free</h1>
    <p class="muted">Upload your broker CSV (same columns as your export). Only <strong>Market buy</strong> rows are used. Buy prices are never shown.</p>
    <p class="muted">Reference date for the six-month rule: <strong>{{ reference.isoformat() }}</strong> (server local date).</p>

    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="card">
      <label for="csv">CSV file</label>
      <input id="csv" name="csv" type="file" accept=".csv,text/csv" required>
      <button type="submit">Analyze</button>
    </form>

    <p class="muted footer-links"><a href="{{ url_for('deploy') }}">Production deployment</a></p>
  </main>
</body>
</html>
